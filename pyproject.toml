[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipd-app"
description = "iCloud Photo Downloader for Windows"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "ipd_app.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
