name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -e .
      - name: Tests (no network, no iCloud account needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
